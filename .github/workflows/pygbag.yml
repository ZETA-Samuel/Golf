name: pygbag_build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build game with pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag
          python -m pygbag --build "$GITHUB_WORKSPACE/main.py"

      - name: Bust cache for generated web assets
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          html_path = Path('build/web/index.html')
          if not html_path.exists():
              raise FileNotFoundError('build/web/index.html was not generated by pygbag')

          sha = os.environ['GITHUB_SHA']
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('golf.tar.gz', f'golf.tar.gz?v={sha}')
          html = html.replace('golf.apk', f'golf.apk?v={sha}')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Upload to GitHub Pages branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
          single-commit: true
